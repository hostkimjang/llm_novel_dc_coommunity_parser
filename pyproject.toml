[project]
name = "llm-novel-batch"
version = "0.1.0"
description = "DCInside genre novel batch classifier with SearchXNG MCP bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.26",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "llama-cpp-python>=0.2.78",
  "kiwipiepy>=0.18",
]

[project.scripts]
llm-batch = "llm_batch.cli:main"
mcp-bridge = "llm_batch.mcp_bridge.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

